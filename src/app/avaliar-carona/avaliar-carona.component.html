<div class="dialog-overlay" (click)="onClose()">
  <div class="dialog-content" (click)="$event.stopPropagation()">
    <header class="dialog-header">
      <h2 class="dialog-title">Avalie sua carona</h2>
      <button type="button" class="btn-close" (click)="onClose()" aria-label="Fechar">
        <i class="fas fa-times"></i>
      </button>
    </header>

    <p class="dialog-intro">Nos conte como foi sua experiência com:</p>

    <div class="info-card" *ngIf="item">
      <img [src]="fotoMotorista" alt="" class="info-card-photo" onerror="this.src='assets/default-profile.png'" />
      <div class="info-card-body">
        <div class="info-card-name">{{ nomeMotorista }}</div>
        <div class="info-card-veiculo">{{ veiculoTexto }}</div>
        <div class="info-card-route">
          <i class="fas fa-map-marker-alt"></i>
          <span>{{ rotaTexto }}</span>
        </div>
        <div class="info-card-datetime">
          <i class="far fa-clock"></i>
          <span>{{ dataHoraTexto }}</span>
        </div>
      </div>
    </div>

    <div class="stars-row">
      <button
        type="button"
        *ngFor="let n of [1,2,3,4,5]; let i = index"
        class="star-btn"
        [class.filled]="nota >= (i + 1)"
        (click)="setNota(i + 1)"
        [attr.aria-label]="'Dar ' + (i + 1) + ' estrela(s)'"
      >
        <i [ngClass]="nota >= (i + 1) ? 'fas fa-star' : 'far fa-star'"></i>
      </button>
    </div>
    <p class="stars-hint">Clique para escolher de 1 a 5 estrelas</p>

    <div class="form-group">
      <label for="comentario">Comentário</label>
      <textarea
        id="comentario"
        [(ngModel)]="comentario"
        rows="4"
        placeholder="Conte como foi a carona..."
        maxlength="500"
      ></textarea>
    </div>

    <p class="erro-msg" *ngIf="erro">{{ erro }}</p>

    <div class="dialog-actions">
      <button
        type="button"
        class="btn-avaliar"
        [disabled]="enviando || nota < 1 || nota > 5"
        (click)="enviar()"
      >
        {{ enviando ? "Enviando..." : "Avaliar" }}
      </button>
    </div>
  </div>
</div>
