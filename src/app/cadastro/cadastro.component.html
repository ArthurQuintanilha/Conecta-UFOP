<app-header></app-header>

<main>
  <!-- Etapa 1: Nome, email, gênero, senha -->
  <div class="card form-padrao" *ngIf="step === 1">
    <h1>Cadastro</h1>
    <div class="sub">
      Já possui uma conta? <a routerLink="/login">Entre</a>
    </div>

    <div class="group">
      <label>Nome Completo *</label>
      <input type="text" />
    </div>

    <div class="group">
      <label>Email (institucional) *</label>
      <input type="email" placeholder="Digite seu email" />
    </div>

    <div class="group">
      <label>Gênero *</label>
      <select>
        <option value="">Selecione seu gênero</option>
        <option>Masculino</option>
        <option>Feminino</option>
        <option>Prefiro não informar</option>
      </select>
    </div>

    <div class="group">
      <label>Senha *</label>
      <input type="password" placeholder="Digite sua senha" />
    </div>

    <div class="rules">
      <span>* Pelo menos 1 letra maiúscula</span>
      <span>* Pelo menos um número</span>
      <span>* Pelo menos um caractere especial</span>
      <span>* Pelo menos 8 dígitos</span>
    </div>

    <button type="button" (click)="nextStep()">Continuar</button>
  </div>

  <!-- Etapa 2: Foto e fale sobre você -->
  <section class="perfil card form-padrao" *ngIf="step === 2">
    <header class="perfil-header">
      <span class="back" (click)="prevStep()" role="button" tabindex="0" (keydown.enter)="prevStep()">
      <i class="fas fa-arrow-left"></i>
      </span>
      <h1>Perfil</h1>
    </header>

    <div class="photo-section">
      <div class="photo-wrapper">
        <div class="photo-circle">
          <i class="fas fa-camera photo-icon"></i>
        </div>
        <button class="add-photo" type="button" aria-label="Adicionar foto">
          <i class="fas fa-plus"></i>
        </button>
      </div>
      <p class="photo-text">Escolha uma foto de perfil</p>
    </div>

    <div class="bio-section">
      <label>Fale sobre você <span class="asterisk">*</span></label>
      <textarea placeholder="Que tal nos contar um pouco mais sobre você." rows="4"></textarea>
    </div>

    <button class="primary" type="button">Finalizar cadastro</button>
  </section>
</main>

<app-footer></app-footer>
