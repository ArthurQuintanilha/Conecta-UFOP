<header class="bg-white border-b border-gray-200 px-4 py-4 relative">
  <div class="container mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2 cursor-pointer" (click)="router.navigate(['/caronas'])">
      <img src="assets/logo.png" alt="ConectaUFOP" class="h-8 w-auto flex-shrink-0" />
      <div class="text-primary font-bold text-xl hidden md:block">ConectaUFOP</div>
    </div>

    <a
      *ngIf="!(currentUser$ | async)"
      routerLink="/login"
      class="flex items-center gap-2 text-gray-700 hover:text-primary transition-colors font-medium px-4 py-2 rounded-lg hover:bg-gray-100"
    >
      Login
    </a>

    <div *ngIf="(currentUser$ | async) as currentUser" class="hidden md:flex items-center gap-4">
      <button class="bg-primary text-white px-4 py-2 rounded-lg font-medium hover:bg-primary/90 transition-colors">
        <a routerLink="/cadastrar-carona">Oferecer carona</a>
      </button>
      <a routerLink="/minhas-caronas" class="flex items-center gap-2 text-gray-700 hover:text-primary transition-colors">
        <i class="fas fa-car text-lg"></i>
        <span class="font-medium">Minhas caronas</span>
      </a>
      <a routerLink="/chat" class="flex items-center gap-2 text-gray-700 hover:text-primary transition-colors relative">
        <i class="fas fa-comments text-lg"></i>
        <span class="font-medium">Chat</span>
        <ng-container *ngIf="(unreadCount$ | async) as count">
          <span *ngIf="count > 0" class="header-unread-badge" [attr.aria-label]="count + ' mensagens não lidas'" [title]="count + ' mensagens não lidas'">
            <svg class="header-unread-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="header-unread-count">{{ count > 99 ? '99+' : count }}</span>
          </span>
        </ng-container>
      </a>
      <div class="relative" (click)="$event.stopPropagation()">
        <button
          type="button"
          (click)="toggleDropdown()"
          class="flex items-center gap-2 text-gray-700 hover:text-primary transition-colors"
          [class.ring-2]="isDropdownOpen"
          [class.ring-primary]="isDropdownOpen"
          [class.rounded-md]="isDropdownOpen"
        >
          <i class="fas fa-user-circle text-xl"></i>
          <span class="font-medium">Olá, {{ currentUser.nome }}</span>
          <i class="fas fa-chevron-down text-sm transition-transform" [class.rotate-180]="isDropdownOpen"></i>
        </button>
        <div
          *ngIf="isDropdownOpen"
          class="absolute right-0 top-full z-50 mt-2 w-48 rounded-lg border border-gray-200 bg-white py-1 shadow-lg"
        >
          <button
            type="button"
            (click)="navTo('/perfil')"
            class="flex w-full items-center gap-2 px-4 py-2 text-left text-gray-700 hover:bg-gray-100 hover:text-primary"
          >
            <i class="fas fa-user-circle"></i>
            <span>Perfil</span>
          </button>
          <button
            type="button"
            (click)="logout()"
            class="flex w-full items-center gap-2 px-4 py-2 text-left text-gray-700 hover:bg-gray-100 hover:text-primary"
          >
            <i class="fas fa-sign-out-alt"></i>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Logado: botão hambúrguer (só em telas pequenas) -->
    <div *ngIf="(currentUser$ | async) as currentUser" class="flex md:hidden items-center">
      <button
        type="button"
        (click)="toggleMobileMenu(); $event.stopPropagation()"
        class="p-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-primary transition-colors"
        aria-label="Abrir menu"
      >
        <i class="fas fa-bars text-xl"></i>
      </button>
    </div>
  </div>

  <!-- Menu mobile (telas pequenas, quando logado) -->
  <ng-container *ngIf="currentUser$ | async as currentUser">
    <div
      *ngIf="isMobileMenuOpen"
      class="md:hidden absolute left-0 right-0 top-full z-50 bg-white border-b border-gray-200 shadow-lg"
      (click)="$event.stopPropagation()"
    >
    <nav class="container mx-auto py-3 px-4 flex flex-col gap-1">
      <a
        routerLink="/cadastrar-carona"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-primary font-medium"
      >
        <i class="fas fa-plus-circle text-lg w-6 text-center"></i>
        <span>Oferecer carona</span>
      </a>
      <a
        routerLink="/minhas-caronas"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-primary font-medium"
      >
        <i class="fas fa-car text-lg w-6 text-center"></i>
        <span>Minhas caronas</span>
      </a>
      <a
        routerLink="/chat"
        (click)="closeMobileMenu()"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-primary font-medium relative"
      >
        <i class="fas fa-comments text-lg w-6 text-center"></i>
        <span>Chat</span>
        <ng-container *ngIf="(unreadCount$ | async) as count">
          <span *ngIf="count > 0" class="header-unread-badge header-unread-badge--mobile" [attr.aria-label]="count + ' mensagens não lidas'" [title]="count + ' mensagens não lidas'">
            <svg class="header-unread-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="header-unread-count">{{ count > 99 ? '99+' : count }}</span>
          </span>
        </ng-container>
      </a>
      <div class="border-t border-gray-200 my-2"></div>
      <button
        type="button"
        (click)="navTo('/perfil')"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-primary font-medium w-full text-left"
      >
        <i class="fas fa-user-circle text-lg w-6 text-center"></i>
        <span>Perfil</span>
      </button>
      <button
        type="button"
        (click)="logout()"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-primary font-medium w-full text-left"
      >
        <i class="fas fa-sign-out-alt text-lg w-6 text-center"></i>
        <span>Sair</span>
      </button>
    </nav>
  </div>
  </ng-container>
</header>
