<app-header></app-header>
<div class="login-container">
  <div class="content">
    <div class="info-card">
      <div class="top-content">
        <h1>Bem vindo ao Conecta UFOP</h1>
        <p>Facilitando a vida universitária</p>
      </div>

      <div class="bottom-content">
        <h2>Transporte com preço acessível</h2>
        <p>
          Pegue uma carona, economize tempo, dinheiro e ainda colabore com os
          motoristas!
        </p>
        <div class="dots">
          <span></span><span class="active"></span><span></span>
        </div>
      </div>
    </div>

    <div class="form-container">
      <div class="tab-group">
        <h1>Entre</h1>
        <p class="signup-text">
          Não possui uma conta? <a routerLink="/cadastro">Cadastre-se</a>
        </p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="loginByAuth()">
        <div class="input-field">
          <label>Email</label>
          <input
            type="email"
            placeholder="usuário@ufop.br"
            formControlName="email"
          />
        </div>

        <div class="input-field">
          <div class="label-row">
            <label>Senha</label>
          </div>
          <input
            type="password"
            placeholder="Digite sua senha"
            formControlName="password"
          />
        </div>
        <a routerLink="/recuperar-senha">Esqueceu a senha?</a>
        <button type="submit" class="btn-main" [disabled]="isAuthLoading || loginForm.invalid">
          {{ isAuthLoading ? "Entrando..." : "Entrar" }}
        </button>
      </form>
    </div>
  </div>
</div>

<app-footer></app-footer>
