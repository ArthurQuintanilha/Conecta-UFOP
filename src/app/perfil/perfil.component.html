<app-header></app-header>

<div class="perfil-container">
  <p class="loading-msg" *ngIf="carregando">Carregando perfil...</p>
  <div class="profile-header" *ngIf="!carregando">
    <div class="title-group">
      <button type="button" class="btn-back" (click)="voltar()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1>Perfil</h1>
    </div>

    <div class="profile-picture-wrapper">
      <div class="profile-picture">
        <img [src]="user.fotoUrl" alt="Foto do Usuário">
      </div>
      <button type="button" class="btn-camera" (click)="acionarInputArquivo()">
        <i class="fas fa-camera"></i>
      </button>
      <input type="file" #fileInput (change)="aoMudarFoto($event)" accept="image/*" style="display: none;">
    </div>
  </div>

  <div class="form-container form-padrao" *ngIf="!carregando">
    <form (ngSubmit)="alterarUser()">
      <div class="input-field">
        <label>Nome Completo <span class="asterisk">*</span></label>
        <input type="text" [(ngModel)]="user.nome" name="nome" placeholder="Seu nome">
      </div>

      <div class="input-field">
        <label>Email Institucional <span class="asterisk">*</span></label>
        <input type="email" [(ngModel)]="user.email" name="email" placeholder="email@aluno.ufop.edu.br" readonly class="input-readonly">
      </div>

      <div class="input-field">
        <label>Gênero <span class="asterisk">*</span></label>
        <select [(ngModel)]="user.genero" name="genero" disabled class="input-readonly">
          <option value="male">Masculino</option>
          <option value="female">Feminino</option>
          <option value="prefer-not-to-say">Prefiro não dizer</option>
        </select>
      </div>

      <div class="input-field">
        <label>Curso / Ocupação <span class="asterisk">*</span></label>
        <select [(ngModel)]="user.curso_ocupacao" name="curso_ocupacao">
          <option value="">Selecione seu curso ou ocupação</option>
          <option *ngFor="let curso of cursosOcupacao" [value]="curso">{{ curso }}</option>
        </select>
      </div>

      <div class="input-field">
        <label>Data de nascimento <span class="asterisk">*</span></label>
        <input type="text" [(ngModel)]="user.dtAniversario" name="dtAniversario" placeholder="dd/mm/aaaa" maxlength="10">
      </div>

      <div class="input-field">
        <label>Descrição</label>
        <textarea [(ngModel)]="user.descricao" name="descricao" placeholder="Fale sobre você..." rows="3"></textarea>
      </div>

      <button type="submit" class="btn-main" [disabled]="salvando">
        {{ salvando ? "Salvando..." : "Salvar alterações" }}
      </button>
    </form>
  </div>
</div>

<app-footer></app-footer>
